<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppRabbit Status</title>
  <meta name="description" content="Live availability for the AppRabbit platform.">
  <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="https://apprabbit.com/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="status.css">
</head>
<body data-page="status" data-base=".">

<header class="topbar">
  <div class="topbar-in">
    <a class="wordmark" href="." style="text-decoration:none;color:inherit">
      <img src="https://studio.apprabbit.app/apprabbit-logo.svg" alt="" width="26" height="26" style="border-radius:8px">
      AppRabbit Status
    </a>
    <nav class="links">
      <a href="." aria-current="page">Status</a>
      <a href="history/">Incident history</a>
      <a href="https://apprabbit.com">apprabbit.com</a>
    </nav>
  </div>
</header>

<div class="shell">
  <main>
    <section class="hero" id="hero">
      <div class="verdict"><h1>Loading status…</h1></div>
    </section>

    <div class="stats" id="stats"></div>
    <div id="active-maint"></div>

    <div class="sec">
      <h2>Services</h2>
      <div class="seg" role="group" aria-label="Display">
        <button type="button" data-view="bars" aria-pressed="true">90-day</button>
        <button type="button" data-view="tiles" aria-pressed="false">Tiles</button>
      </div>
    </div>

    <div class="services" id="view-bars"></div>
    <div class="tiles hidden" id="view-tiles"></div>

    <div class="sec">
      <h2>Recent</h2>
      <span class="hint"><a href="history/" style="color:var(--accent)">full history →</a></span>
    </div>
    <div id="recent"></div>
  </main>

  <footer>
    <span id="footer-stamp">—</span>
    <span><a href="data.json">Status JSON</a> · checks by <a href="https://upptime.js.org">Upptime</a></span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
