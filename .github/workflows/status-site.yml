# Builds site/data.json and publishes the custom status pages to gh-pages.
#
# Replaces Upptime's own Static Site CI (disabled): upstream still does the
# probing, issue lifecycle and data commits — we own only the rendering.
name: Status site

on:
  # After each probe round, so the page reflects the check that just ran.
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  # Floor, in case the probe workflow is skipped or cancelled.
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [maintenance]
  workflow_dispatch:

concurrency:
  group: status-site
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Snapshot maintenance notices
        run: bash scripts/mirror-maintenance.sh
        env:
          STATUS_DOC_URL: ${{ vars.STATUS_DOC_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build status data
        run: node scripts/build-status-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          STATUS_DOC_URL: ${{ vars.STATUS_DOC_URL }}

      # data/daily/*.json is the 90-day strip accumulating one day at a time —
      # it only exists if it is committed back.
      - name: Commit accumulated history
        run: |
          git config user.name "statuspage bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # maintenance/ only exists once a notice has been published.
          git add data site/data.json
          [ -d maintenance ] && git add maintenance
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update status data [skip ci]"
            git push
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false
          user_name: "statuspage bot"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
